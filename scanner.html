<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skaner — Premium</title>
  <meta name="description" content="QR kod skanerlash paneli. Davomat qayd etish.">
  <link rel="stylesheet" href="css/premium-theme.css">
  <style>
    /* Specific styles for Scanner Premium */
    body.premium-layout { background: #0B0F19; color: #fff; } /* Scanner is always dark mode preferred */
    .pr-scanner-container { max-width: 1200px; margin: 0 auto; padding: 40px 24px; }
    
    .pr-scan-box-wrap {
      background: var(--pr-surface); border: 1px solid var(--pr-border);
      border-radius: var(--pr-radius-xl); padding: 32px;
      box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
      position: relative; overflow: hidden;
      display: flex; flex-direction: column; align-items: center;
    }
    
    .pr-scan-area {
      width: 100%; max-width: 450px; aspect-ratio: 1;
      border-radius: var(--pr-radius-lg); overflow: hidden;
      position: relative; background: #000;
      box-shadow: inset 0 0 0 2px var(--pr-primary-light);
    }
    
    .pr-laser {
      position: absolute; top: 0; left: 0; right: 0; height: 3px;
      background: var(--pr-primary); box-shadow: 0 0 20px 4px var(--pr-primary);
      animation: scanLaser 2s linear infinite; display: none; z-index: 10;
    }
    @keyframes scanLaser {
      0% { top: 0; }
      50% { top: 100%; }
      100% { top: 0; }
    }
    
    .pr-scanner-stats {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; margin-bottom: 40px;
    }
    
    .pr-recent-scans {
      background: var(--pr-surface); border: 1px solid var(--pr-border);
      border-radius: var(--pr-radius-xl); padding: 24px; margin-top: 40px;
    }
    
    .pr-history-item {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px; border-bottom: 1px solid var(--pr-border);
      transition: var(--pr-transition);
    }
    .pr-history-item:hover { background: var(--pr-surface-hover); }
    .pr-history-item:last-child { border-bottom: none; }
  </style>
  <!-- html5-qrcode -->
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="premium-layout dark-mode">

<div class="pr-scanner-container">
  
  <header style="display:flex; justify-content:space-between; align-items:center; margin-bottom:40px;">
    <div>
      <h1 class="pr-page-title" style="margin:0; display:flex; align-items:center; gap:12px;">
        <div style="width:12px; height:12px; background:var(--pr-primary); border-radius:50%; box-shadow:0 0 10px var(--pr-primary);" id="scanDot"></div>
        QR Skaner
      </h1>
      <div id="scanDate" style="color:var(--pr-text-muted); font-size:15px; margin-top:8px;"></div>
    </div>
    <button class="pr-btn" style="background:var(--pr-surface-hover); border:1px solid var(--pr-border); color:#fff;" onclick="Auth.logout()">
      <i data-lucide="log-out" width="18" height="18"></i> Chiqish
    </button>
  </header>

  <div class="pr-scanner-stats">
    <div class="pr-stat-card">
      <div class="pr-stat-icon purple"><i data-lucide="scan" width="28" height="28"></i></div>
      <div>
        <div class="pr-stat-val" id="statTotal">0</div>
        <div class="pr-stat-label">Bugungi skanerlar</div>
      </div>
    </div>
    <div class="pr-stat-card">
      <div class="pr-stat-icon green"><i data-lucide="graduation-cap" width="28" height="28"></i></div>
      <div>
        <div class="pr-stat-val" id="statTeachers">0</div>
        <div class="pr-stat-label">O'qituvchilar</div>
      </div>
    </div>
    <div class="pr-stat-card">
      <div class="pr-stat-icon orange"><i data-lucide="users" width="28" height="28"></i></div>
      <div>
        <div class="pr-stat-val" id="statStudents">0</div>
        <div class="pr-stat-label">O'quvchilar</div>
      </div>
    </div>
  </div>

  <div style="display:grid; grid-template-columns: 1fr 1fr; gap:40px; align-items:start;">
    
    <!-- Scanner Side -->
    <div class="pr-scan-box-wrap">
      <div style="text-align:center; margin-bottom:24px;">
        <h2 style="font-size:20px; font-weight:700; margin:0 0 8px 0;">Kamerani to'g'rilang</h2>
        <p style="color:var(--pr-text-muted); font-size:14px; margin:0;">QR kodni hoshiya markaziga joylashtiring</p>
      </div>

      <div class="pr-scan-area">
        <div id="reader" style="width:100%; height:100%;"></div>
        <div class="pr-laser" id="scanLine"></div>
      </div>

      <div style="margin-top:32px; display:flex; gap:16px;">
        <button class="pr-btn pr-btn-primary" id="startBtn" onclick="startScanner()" style="padding:12px 32px; font-size:16px;">
          <i data-lucide="play" width="20" height="20"></i> Skanerni yoqish
        </button>
        <button class="pr-btn" id="stopBtn" onclick="stopScanner()" style="display:none; padding:12px 32px; font-size:16px; background:var(--pr-danger-bg); color:var(--pr-danger); border:1px solid transparent;">
          <i data-lucide="square" width="20" height="20"></i> To'xtatish
        </button>
      </div>
    </div>

    <!-- History Side -->
    <div class="pr-recent-scans" style="margin-top:0;">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:24px;">
        <h3 style="font-size:18px; font-weight:700; margin:0; display:flex; align-items:center; gap:8px;"><i data-lucide="history" width="20" height="20" style="color:var(--pr-primary);"></i> So'nggi tarix</h3>
        <button class="pr-icon-btn" onclick="clearRecent()" title="Tozalash"><i data-lucide="trash-2"></i></button>
      </div>

      <div id="recentList">
        <div style="text-align:center; padding:40px 0; color:var(--pr-text-muted);">
          <i data-lucide="clock" width="48" height="48" style="opacity:0.3; margin-bottom:16px;"></i>
          <p style="font-size:15px;">Hali skanerlash amalga oshirilmadi</p>
        </div>
      </div>
    </div>

  </div>
</div>

<!-- Toast -->
<div id="toastContainer" style="position:fixed; bottom:24px; right:24px; z-index:9999; display:flex; flex-direction:column; gap:12px;"></div>

<script src="js/data.js"></script>
<script src="js/auth.js"></script>
<script src="js/scanner.js"></script>
<script>
  lucide.createIcons();
  
  const currentUser = Auth.requireAuth(['scanner']);

  // Date
  document.getElementById('scanDate').textContent = new Date().toLocaleDateString('uz-UZ', {
    weekday: 'long', day: '2-digit', month: 'long', year: 'numeric'
  });

  let sessionScans = [];

  function updateStats() {
    const today = DB.today();
    const att = DB.getAttendanceByDate(today);
    document.getElementById('statTotal').textContent = att.length;
    document.getElementById('statTeachers').textContent = att.filter(a => a.personType === 'teacher').length;
    document.getElementById('statStudents').textContent = att.filter(a => a.personType === 'student').length;
  }
  updateStats();

  function showToast(msg, type='success') {
    const c = document.getElementById('toastContainer');
    const t = document.createElement('div');
    const bg = type === 'success' ? 'var(--pr-success)' : (type === 'error' ? 'var(--pr-danger)' : 'var(--pr-warning)');
    t.style.cssText = `
      background: ${bg}; color: #fff; padding: 12px 20px; border-radius: 12px;
      font-weight: 600; font-size: 14px; display: flex; align-items: center; gap: 8px;
      box-shadow: var(--pr-shadow-md); transform: translateY(20px); opacity: 0;
      transition: all 0.3s ease;
    `;
    const icon = type === 'success' ? 'check-circle' : 'alert-circle';
    t.innerHTML = `<i data-lucide="${icon}" width="18" height="18"></i> <span>${msg}</span>`;
    c.appendChild(t);
    lucide.createIcons();
    
    setTimeout(() => { t.style.transform = 'translateY(0)'; t.style.opacity = '1'; }, 10);
    setTimeout(() => { t.style.transform = 'translateY(20px)'; t.style.opacity = '0'; setTimeout(() => t.remove(), 300); }, 3500);
  }

  function startScanner() {
    document.getElementById('startBtn').style.display = 'none';
    document.getElementById('stopBtn').style.display = 'inline-flex';
    document.getElementById('scanLine').style.display = 'block';
    
    ScannerManager.start((result, person, personType) => {
      updateStats();
      addToRecent(result, person, personType);
    });
  }

  function stopScanner() {
    ScannerManager.stop();
    document.getElementById('startBtn').style.display = 'inline-flex';
    document.getElementById('stopBtn').style.display = 'none';
    document.getElementById('scanLine').style.display = 'none';
  }

  function addToRecent(result, person, personType) {
    const name = person ? (person.name + (person.surname ? ' ' + person.surname : '')) : 'Noma\'lum';
    const typeIcon = personType === 'teacher' ? 'graduation-cap' : 'user';
    sessionScans.unshift({
      icon: typeIcon,
      name,
      time: DB.nowTime(),
      duplicate: result.alreadyScanned,
    });
    renderRecent();
  }

  function renderRecent() {
    const el = document.getElementById('recentList');
    if (!sessionScans.length) {
      el.innerHTML = '<div style="text-align:center; padding:40px 0; color:var(--pr-text-muted);"><i data-lucide="clock" width="48" height="48" style="opacity:0.3; margin-bottom:16px;"></i><p style="font-size:15px;">Hali skanerlash amalga oshirilmadi</p></div>';
      lucide.createIcons();
      return;
    }
    el.innerHTML = sessionScans.slice(0, 10).map(s => `
      <div class="pr-history-item">
        <div style="display:flex; align-items:center; gap:16px;">
          <div style="width:40px; height:40px; border-radius:50%; background:var(--pr-surface-hover); display:flex; align-items:center; justify-content:center; color:var(--pr-text-muted);">
            <i data-lucide="${s.icon}" width="18" height="18"></i>
          </div>
          <div>
            <div style="font-weight:600; font-size:15px; color:var(--pr-text-main);">${s.name}</div>
            <div style="font-size:12px; color:var(--pr-text-muted);"><i data-lucide="clock" width="12" height="12" style="vertical-align:-2px; margin-right:4px;"></i>${s.time}</div>
          </div>
        </div>
        <div class="pr-pill ${s.duplicate ? 'warning' : 'success'}">
          ${s.duplicate ? 'Takror' : 'Qabul'}
        </div>
      </div>
    `).join('');
    lucide.createIcons();
  }

  function clearRecent() {
    sessionScans = [];
    renderRecent();
  }
</script>
</body>
</html>
